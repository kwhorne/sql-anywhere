name: cr-sqlite extension

# Builds the experimental cr-sqlite (CRDT) loadable extension for every release
# platform. Kept separate from the main CI (and NOT a required check) because it
# needs a pinned nightly toolchain + build-std and only matters when the ext/crr
# sources change. On a tag it attaches per-platform archives to the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the extension to (e.g. v0.3.0)"
        required: false
  push:
    tags:
      - "v*.*.*"
    branches: [ "main" ]
    paths:
      - "sqlanywhere-sqlite3/ext/crr/**"
      - "scripts/build-crsqlite.sh"
      - ".github/workflows/crsqlite.yml"
  pull_request:
    paths:
      - "sqlanywhere-sqlite3/ext/crr/**"
      - "scripts/build-crsqlite.sh"
      - ".github/workflows/crsqlite.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build cr-sqlite (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            ext: dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: so
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install pinned nightly + rust-src
        run: rustup toolchain install nightly-2023-10-05 --component rust-src --profile minimal

      - name: Build the extension
        run: scripts/build-crsqlite.sh

      - name: Verify and package
        id: package
        shell: bash
        run: |
          set -eux
          out="sqlanywhere-sqlite3/ext/crr/dist/crsqlite.${{ matrix.ext }}"
          test -f "$out"
          file "$out"
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          name="crsqlite-${tag}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "$out" "dist/$name/"
          cp docs/CRDT.md "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "${name}.tar.gz" "$name"
          echo "asset=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: crsqlite-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true
