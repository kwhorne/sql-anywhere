# sqld with Prometheus and Grafana, the dashboard already loaded:
#
#   docker compose -f tools/observability/docker-compose.yml up
#
# then open http://localhost:3000 (anonymous viewer access) and the
# "SQL Anywhere sqld" dashboard. sqld's user API is on http://localhost:8080.
services:
  sqld:
    image: ghcr.io/kwhorne/sqlanywhere-server:latest
    environment:
      SQLD_NODE: primary
      # /metrics is served by the admin API, which is off unless given an address.
      SQLD_ADMIN_LISTEN_ADDR: 0.0.0.0:9090
      # Checkpoint every minute rather than every hour, so the demo's WAL
      # checkpoint panel has something to show.
      SQLD_CHECKPOINT_INTERVAL_S: "60"
    ports:
      - "8080:8080"
    volumes:
      - sqld-data:/var/lib/sqld

  prometheus:
    image: prom/prometheus:v2.53.2
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  sqld-data:
