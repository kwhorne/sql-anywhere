name: cr-sqlite extension

# Builds the experimental cr-sqlite (CRDT) loadable extension for every release
# platform. Kept separate from the main CI (and NOT a required check) because it
# needs a pinned nightly toolchain + build-std and only matters when the ext/crr
# sources change. On a tag it attaches per-platform archives to the release.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the extension to (e.g. v0.3.0)"
        required: false
  push:
    tags:
      - "v*.*.*"
    branches: [ "main" ]
    paths:
      - "sqlanywhere-sqlite3/ext/crr/**"
      - "scripts/build-crsqlite.sh"
      - ".github/workflows/crsqlite.yml"
  pull_request:
    paths:
      - "sqlanywhere-sqlite3/ext/crr/**"
      - "scripts/build-crsqlite.sh"
      - ".github/workflows/crsqlite.yml"

permissions:
  contents: write

jobs:
  build:
    name: Build cr-sqlite (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            ext: dylib
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: so
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: so
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install clang (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Install pinned nightly + rust-src
        run: rustup toolchain install nightly-2023-10-05 --component rust-src --profile minimal

      - name: Build the extension
        run: scripts/build-crsqlite.sh

      - name: Verify and package
        id: package
        shell: bash
        run: |
          set -eux
          out="sqlanywhere-sqlite3/ext/crr/dist/crsqlite.${{ matrix.ext }}"
          test -f "$out"
          file "$out"
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          tag="${tag//\//-}"   # sanitize slashes from PR refs like '15/merge'
          name="crsqlite-${tag}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "$out" "dist/$name/"
          cp docs/CRDT.md "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "${name}.tar.gz" "$name"
          echo "asset=${name}.tar.gz" >> "$GITHUB_OUTPUT"

      # Verify the extension works through the sqlanywhere Rust API (load +
      # crsql_as_crr + changeset merge + conflict resolution). Run once, on the
      # standard Linux target, to keep the matrix fast.
      - name: Run Rust CRDT integration test
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        env:
          SQLANYWHERE_CRSQLITE: ${{ github.workspace }}/sqlanywhere-sqlite3/ext/crr/dist/crsqlite.so
        run: |
          sudo apt-get install -y libclang-dev protobuf-compiler
          cargo test -p sqlanywhere --test crdt
          cargo test -p sqlanywhere --test collab_vector

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: crsqlite-${{ matrix.target }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ steps.package.outputs.asset }}
          fail_on_unmatched_files: true

  # A user of a prebuilt extension downloads a shared object and hands it to
  # .load, where it runs with the full privileges of the host process. So the
  # release carries a signed manifest of what was built: SHA256SUMS for
  # integrity, an Ed25519 signature over the manifest for authenticity, and the
  # extension interface version each artifact was compiled against.
  #
  # This job runs on every build, not just tags, so the tooling itself stays
  # covered. Signing needs the EXTENSION_SIGNING_KEY secret; without it the
  # manifest is still produced but marked unsigned, and the verify step is told
  # to accept that.
  sign:
    name: Sign extension manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Collect the built artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: crsqlite-*
          merge-multiple: true
          path: dist

      - name: Write and sign the manifest
        env:
          EXTENSION_SIGNING_KEY: ${{ secrets.EXTENSION_SIGNING_KEY }}
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          tag="${tag//\//-}"
          cargo run -q -p xtask -- sign-extensions dist "$tag"

      - name: Verify what we are about to publish
        run: |
          if [ -f sqlanywhere-sqlite3/ext/SIGNING_KEY.pub ] && [ -f dist/MANIFEST.json.sig ]; then
            cargo run -q -p xtask -- verify-extensions dist
          else
            echo "::warning::No extension trust root or signature; verifying digests only."
            cargo run -q -p xtask -- verify-extensions dist --allow-unsigned
          fi

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: crsqlite-manifest
          path: |
            dist/MANIFEST.json
            dist/MANIFEST.json.sig
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Attach manifest to release (tags only)
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/MANIFEST.json
            dist/MANIFEST.json.sig
            dist/SHA256SUMS
          fail_on_unmatched_files: false
